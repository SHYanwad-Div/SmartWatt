version: '3.7'
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=smartwatt
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb_data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer

  # Secrets and personal values come from docker/.env (git-ignored).
  # Copy .env.example to .env and fill it in; empty values turn that feature off.
  ingest:
    build: ../ingest
    environment:
      - MQTT_URL=mqtt://mosquitto:1883
      - INFLUX_HOST=influxdb
      - INFLUX_DB=smartwatt
      - ALERT_THRESHOLD_W=${ALERT_THRESHOLD_W:-1200}
      - ALERT_COOLDOWN_SEC=${ALERT_COOLDOWN_SEC:-900}
      - OPENWEATHER_KEY=${OPENWEATHER_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}

    ports:
      - "3000:3000"

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
