# Publishes the Smart Watt v2 live demo (static, no server) to GitHub Pages.
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The demo then lives at https://<user>.github.io/SmartWatt/
name: Deploy live demo

on:
  push:
    branches: [main]
    paths:
      - 'smartwatt-v2/frontend/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartwatt-v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smartwatt-v2/frontend/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: smartwatt-v2/frontend/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
